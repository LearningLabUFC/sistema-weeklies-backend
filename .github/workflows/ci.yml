name: CI Back-end

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar o código do repositório
      uses: actions/checkout@v4

    - name: Configurar o Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Instalar Ruff
      run: pip install ruff

    - name: Rodar o linter
      run: ruff check .

  testes:
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: weeklies_user
          POSTGRES_PASSWORD: weeklies_secret
          POSTGRES_DB: weeklies_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U weeklies_user -d weeklies_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://weeklies_user:weeklies_secret@localhost:5432/weeklies_db
      POSTGRES_USER: weeklies_user
      POSTGRES_PASSWORD: weeklies_secret
      POSTGRES_DB: weeklies_db
      POSTGRES_PORT: "5432"
      SECRET_KEY: chave-apenas-para-ci
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60

    steps:
    - name: Baixar o código do repositório
      uses: actions/checkout@v4

    - name: Configurar o Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest

    - name: Rodar os testes
      run: pytest
