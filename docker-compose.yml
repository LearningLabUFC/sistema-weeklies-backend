services:
  # ── PostgreSQL ─────────────────────────────────────────────
  db:
    image: postgres:15
    container_name: weeklies_db
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-weeklies_user} -d ${POSTGRES_DB:-weeklies_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── pgAdmin 4 (Visual Database Manager) ────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: weeklies_pgadmin
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy

  # ── Redis (OTP / Cache em memória) ─────────────────────────
  redis:
    image: redis:7-alpine
    container_name: weeklies_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  pgadmin_data:
  redis_data:
